name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  scaffold-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify scaffold
        run: make verify

      - name: Record scaffold release note
        run: |
          mkdir -p dist
          printf '%s\n' 'This tag passed the scaffold release gate. Plugin binary packaging starts after ABI implementation exists.' > dist/SCAFFOLD_RELEASE_NOTE.txt

      - name: Upload scaffold note
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-release-note
          path: dist/SCAFFOLD_RELEASE_NOTE.txt
