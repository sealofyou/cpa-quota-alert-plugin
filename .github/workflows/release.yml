name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Linux plugin
        run: make linux-release-gate

      - name: Create checksum
        run: |
          cd dist
          sha256sum cpa-quota-alert-plugin.so > cpa-quota-alert-plugin.so.sha256

      - name: Upload verified assets
        uses: actions/upload-artifact@v4
        with:
          name: cpa-quota-alert-plugin-linux-amd64
          if-no-files-found: error
          path: |
            dist/cpa-quota-alert-plugin.so
            dist/cpa-quota-alert-plugin.so.sha256

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: Linux amd64 CPA native plugin release candidate assets. Verify cpa-quota-alert-plugin.so against the attached SHA-256 checksum before installing.
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "$RELEASE_NOTES"
            gh release upload "$TAG_NAME" \
              dist/cpa-quota-alert-plugin.so \
              dist/cpa-quota-alert-plugin.so.sha256 \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/cpa-quota-alert-plugin.so \
              dist/cpa-quota-alert-plugin.so.sha256 \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes "$RELEASE_NOTES"
          fi
