name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify scaffold
        run: make verify

      - name: Check whitespace
        run: git diff --check

      - name: Check placeholder markers
        run: |
          if grep -RInE 'TB[D]|TO[D]O|待确[认]' -- . --exclude-dir=.git; then
            exit 1
          fi

      - name: Public safety scan
        run: |
          if grep -RInE '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----|Bearer [A-Za-z0-9._~+/=-]{20,}|[A-Za-z0-9._%+-]+@(gmail|qq|163|126|outlook|hotmail|icloud)\.com|([0-9]{1,3}\.){3}[0-9]{1,3}|(api[_-]?key|secret|credential)[[:space:]]*[:=][[:space:]]*[^[:space:]]{8,}' -- . --exclude-dir=.git; then
            exit 1
          fi