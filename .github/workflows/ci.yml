name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  linux-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify Linux plugin
        run: make linux-release-gate

      - name: Verify shared-library artifacts
        run: |
          test -s dist/cpa-quota-alert-plugin.so
          test -s dist/cpa-quota-alert-plugin.h

      - name: Check committed whitespace
        run: git show --check --format= HEAD

      - name: Check placeholder markers
        shell: bash
        run: |
          set -u
          pattern='TB[D]|TO[D]O|待确[认]'
          set +e
          git grep -n -E -e "$pattern" -- .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Placeholder markers found in tracked files."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Placeholder scan failed with git grep exit $status."
            exit "$status"
          fi

      - name: Public safety scan
        shell: bash
        run: |
          set -u
          pattern='-{5}BEGIN[[:space:]]+(RSA[[:space:]]+|OPENSSH[[:space:]]+|EC[[:space:]]+|DSA[[:space:]]+)?PRIVATE[[:space:]]+KEY-{5}|Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}|[A-Za-z0-9._%+-]+@(gmail|qq|163|126|outlook|hotmail|icloud)\.com|([0-9]{1,3}\.){3}[0-9]{1,3}|(api[_-]?key|secret|credential|token|password)[[:space:]]*[:=][[:space:]]*[^[:space:]]{8,}'
          set +e
          git grep -n -E -e "$pattern" -- .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Potential secret or personal data found in tracked files."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Public safety scan failed with git grep exit $status."
            exit "$status"
          fi
