# Operator local assumption example, not OpenAI official fact.
# Use only after the operator has independently confirmed these pool weights.
#
# The upstream account surface reports each subscription tier as its own plan_type
# value, so every tier gets its own rule and its own weight here. One rule must never
# collect two upstream plan types: that would apply one tier's multiplier to another
# tier's accounts, and the plugin rejects such a config at load time.
#
# "prolite" and "pro" are separate upstream values and carry separate weights below.
# "promax" and every other upstream tier are deliberately absent: an account on an
# unconfigured tier stops the weighted total and raises a plan-change alert instead
# of being folded into a neighbouring weight.

dry_run: true
concurrency: 4
request_timeout_seconds: 45
retry_attempts: 2
stale_after_seconds: 900
low_threshold: 1.5
recovery_threshold: 1.6
reminder_seconds: 86400
failure_alert_count: 3
state_path: /var/lib/cpa-quota-alert-plugin/state.json

allowed_quota_hosts:
  - chatgpt.com

ignored_plans:
  - free

terminal_error_codes:
  - token_invalidated
  - token_revoked
  - deactivated_workspace

plan_rules:
  - name: plus
    aliases:
      - plus
      - chatgptplus
    window: 7d
    weight: 1
  - name: team
    aliases:
      - team
      - chatgptteam
    window: 7d
    weight: 1
  - name: k12
    aliases:
      - k12
      - chatgptk12
    window: 5h
    weight: 0.2
  - name: prolite
    aliases:
      - prolite
    window: 7d
    weight: 5
  - name: pro
    aliases:
      - pro
      - chatgptpro
    window: 7d
    weight: 20

smtp:
  enabled: true
  host: smtp.example.com
  port: 587
  tls_mode: starttls
  timeout_seconds: 10
  username_env: CPA_QUOTA_ALERT_SMTP_USER
  password_env: CPA_QUOTA_ALERT_SMTP_PASSWORD
  recipients_env: CPA_QUOTA_ALERT_SMTP_TO
  from_env: CPA_QUOTA_ALERT_SMTP_FROM
  from_name: CPA Quota Alert

webhook:
  enabled: false
  method: POST
  timeout_seconds: 10
  url_env: CPA_QUOTA_ALERT_WEBHOOK_URL
  auth_header_env: CPA_QUOTA_ALERT_WEBHOOK_AUTH
