# Copy only the mail.templates block you want to override into CPA plugin YAML.
# Leave recipients, SMTP user, password, and From in the root-only env file.
# Placeholders are replaced with aggregate values only. Unknown placeholders are rejected.

mail:
  templates:
    low:
      subject: "[CPA quota] remaining {{total}} Plus-week equivalents"
      body: |
        CPA quota is below the configured low threshold.

        Remaining: {{total}}
        Low threshold: {{low_threshold}}
        Recovery threshold: {{recovery_threshold}}
        Partial snapshot: {{partial}}
        Unresolved accounts: {{unresolved_count}}
        Occurred at (UTC): {{occurred_at}}
    low_reminder:
      subject: "[CPA quota] still low: {{total}} Plus-week equivalents"
      body: |
        CPA quota is still below the configured low threshold.

        Remaining: {{total}}
        Low threshold: {{low_threshold}}
        Occurred at (UTC): {{occurred_at}}
    recovery:
      subject: "[CPA quota] recovered to {{total}} Plus-week equivalents"
      body: |
        CPA quota has reached the configured recovery threshold.

        Remaining: {{total}}
        Recovery threshold: {{recovery_threshold}}
        Occurred at (UTC): {{occurred_at}}
    data_error:
      subject: "[CPA quota] check failed {{consecutive_failures}} times"
      body: |
        Consecutive failures: {{consecutive_failures}}
        Error code: {{error_code}}
        Occurred at (UTC): {{occurred_at}}
    plan_changed:
      subject: "[CPA quota] unrecognized plan types"
      body: |
        Unrecognized plans: {{unknown_plans}}
        Occurred at (UTC): {{occurred_at}}
    test_notification:
      subject: "[CPA quota] test notification"
      body: |
        This is a delivery-channel test. It is not a real quota change.
        Occurred at (UTC): {{occurred_at}}
